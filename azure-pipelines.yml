trigger:
  branches:
    include:
      - main
      - master  # Covers whichever branch your Fabric workspace is syncing to

pool:
  vmImage: 'ubuntu-latest'

steps:
- checkout: self
  persistCredentials: true
  fetchDepth: 0  # Ensures full history is present

- script: |
    # 1. Identity setup
    git config --global user.email "fabric-bot@azuredevops.com"
    git config --global user.name "Fabric Mirror Bot"
    
    # 2. Boost buffers to prevent unpacking crashes
    git config --global http.postBuffer 524288000
    git config --global http.maxRequestBuffer 100M
    git config --global core.compression 0
    
    # 3. DYNAMIC PUSH: Pulls the active branch dynamically (HEAD) 
    # and forces it out to GitHub's 'main' branch
    git push --force "https://${GITHUB_PAT}@github.com/vpnagrani/CivicSustainIQ-fabric.git" HEAD:main
    
  displayName: 'Mirroring Microsoft Fabric Workspace to External Git'
  env:
    GITHUB_PAT: $(SECRET_GITHUB_PAT)